name: apply bootstrap review reconciliation

on:
  push:
    branches:
      - agent/bootstrap-development-governance-v0
    paths:
      - ".github/review-fix/**"
      - ".github/workflows/apply-bootstrap-review-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct reviewed tree and validate it
        shell: bash
        run: |
          set -euo pipefail
          cat .github/review-fix/part-* > /tmp/review-fix.tar.gz.b64
          echo "8b55663eb8ef2344b34cbe36cfc7cbfbe112a672e9b973179d6a00fe70028a79  /tmp/review-fix.tar.gz.b64" | sha256sum -c -
          base64 --decode /tmp/review-fix.tar.gz.b64 > /tmp/review-fix.tar.gz
          echo "3312e53a2ffeca5832681ab3ac1d7505c2b14698b942ec7dcdb4bd35978a05b7  /tmp/review-fix.tar.gz" | sha256sum -c -
          tar -xzf /tmp/review-fix.tar.gz -C .
          rm -rf .github/review-fix
          rm -f .github/workflows/apply-bootstrap-review-fix.yml
          python3 tools/build_manifest.py --check
          python3 -m unittest discover -s tests -v
          python3 -m py_compile tools/*.py .agents/tools/*.py tests/*.py
          bash -n tools/publish_bootstrap.sh
          git diff --check
      - name: Commit reconciled review blockers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile bootstrap review blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
